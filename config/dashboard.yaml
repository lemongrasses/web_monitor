# AIO System Dashboard — Jetson configuration.
#
# Works as-is: everything marked "auto" is detected at start-up, and everything marked
# "optional" can stay empty. Edit only what you want to pin down, then:
#   sudo systemctl restart aio-dashboard
# Relative paths resolve against the dashboard install folder.

product:      { host: 0.0.0.0, port: 8080 }
maintenance:  { host: 0.0.0.0, port: 8081 }

# Who may open the pages. The external computer on the sensor LAN is fixed at 192.168.116.154
# (this Jetson is 192.168.116.1 on eno1). This Jetson itself (127.0.0.1) is always allowed.
# IPs or CIDRs; empty list = no restriction.
access:
  allowed_clients: [192.168.116.154]

nav:
  udp_bind: 127.0.0.1:9000       # aio_nav_node always sends here
  # auto: newest aio_nav.yaml under /home/*/aio-nav-ros/install/... or ~/.local/opt/aio-nav-ros/...
  # The destination (output_udp) and rate (output_rate) shown in the UI are read from it.
  aio_nav_config: auto
  expected_rate_hz: null         # null = output_rate from aio_nav.yaml
  service: aio_nav
  allow_control: true            # Overview Start/Stop launches AIO NAV + DSO, like the AIO Nav app
  control_group: [aio_nav, dso]  # started in this order; both stopped together
  stale_warn_s: 0.5              # UDP "Stale" after this packet age
  stale_fault_s: 2.0             # UDP "Lost" / product Fault after this packet age
  gnss_timeout_s: 3.0            # GNSS "Unavailable" if no GNSS update for this long
  ready_requires: [alignment, heading_valid, fine_alignment]   # all three lamps must be on
  trajectory: { recent_window_s: 60, recent_hz: 10, older_hz: 1 }

# ROS domain follows the camera/IMU drivers (/opt/point-lab/bin/launch_openrtk330_basler.sh: domain 10,
# localhost only), set in deploy/aio-dashboard.service. AIO NAV runs on domain 13, so its data comes
# over UDP only and /nav/odometry and /aio_nav_node are not monitored through ROS here.
# systemd units. A unit that does not exist shows "Not installed" and raises no warning.
# AIO NAV is also detected by process name, so the desktop app start works too.
# Units with restartable: true get a Restart button (re-run install.sh after changing).
services:
  aio_nav:   { label: AIO NAV, unit: aio-nav.service, process_pattern: lib/aio_nav_ros/aio_nav_node, launch: aio-nav }
  dso:       { label: DSO, process_pattern: lib/dso_ros/dso_live, launch: aio-nav-dso, optional: true }
  camera:    { label: Camera driver, unit: camera.service, restartable: true, process_pattern: pylon_ros2_camera_wrapper }   # Basler, started by ros2 launch
  ouster:    { label: Ouster driver, unit: ouster.service, restartable: true }   # optional
  dashboard: { label: Dashboard, unit: aio-dashboard.service }

# host (optional): IP to ping. Empty = shown as "Not set up", no warnings.
# preview topic: auto = first CompressedImage/Image (camera) or PointCloud2 (LiDAR) topic.
#   Use hint to prefer a name, e.g. hint: ouster, or set topic: /exact/name.
devices:
  camera:
    label: Camera
    host: 192.168.116.82           # Basler camera (MAC 00:30:53:..) on eno1
    service: camera
    topic_group: camera
    preview: { kind: image, topic: auto, max_width: 960 }
  lidar:
    label: LiDAR
    host: ""
    service: ouster
    topic_group: lidar
    preview: { kind: pointcloud, topic: auto, max_points: 30000 }

network:
  sensor_interface: auto         # auto = interface used to reach the sensors / default route
  ping_interval_s: 5

system:
  interval_s: 2
  disk_paths: ["/"]
  disk_warn_percent: 90
  temp_warn_c: 85

# ROS topics to monitor. name: auto picks the topic by message type (hint prefers a name,
# strict: true requires it). An auto topic that finds nothing shows "Not found", no warning.
ros:
  enabled: true
  graph_interval_s: 2
  rate_window_s: 2
  nodes: [/basler/pylon_ros2_camera_node, /openrtk330_driver]
  topics:
    - { name: /openrtk330/imu/data_raw, group: nav, label: INS IMU, expected_hz: 100 }
    - { name: auto, type: sensor_msgs/msg/CameraInfo,  group: camera, label: Camera, expected_hz: 20 }
    - { name: auto, type: sensor_msgs/msg/PointCloud2, group: lidar,  label: LiDAR points, hint: ouster }
    - { name: auto, type: sensor_msgs/msg/Imu,         group: lidar,  label: Ouster IMU,   hint: ouster, strict: true }

# auto = the aio-nav-ros output folder (from fusion_txt_path, or output/ next to install/).
# Or list folders: roots: [{ id: logs, name: AIO NAV logs, path: /home/jetson/aio-nav-ros/output }]
data:
  roots: auto

events:
  log_file: logs/events.jsonl
  max_memory: 500

actions:
  restart_timeout_s: 30
  diagnostic_timeout_s: 15

fake:
  enabled: false
  state_file: dev/fake_state.json
